config:
  target: 'http://localhost:3000'
  phases:
    - duration: 60
      arrivalRate: 10
    - duration: 60
      arrivalRate: 50
    - duration: 60
      arrivalRate: 100
  defaults:
    headers:
      Content-Type: 'application/json'

scenarios:
  - name: 'Invoice Creation Load Test'
    weight: 40
    flow:
      - post:
          url: '/api/login'
          json:
            email: '{{ $randomEmail() }}'
            password: 'password123'
          capture:
            - json: '$.result.token'
              as: 'authToken'
      - post:
          url: '/api/client'
          headers:
            Authorization: 'Bearer {{ authToken }}'
          json:
            name: '{{ $randomFullName() }}'
            email: '{{ $randomEmail() }}'
            phone: '{{ $randomPhoneNumber() }}'
            country: 'USA'
            address: '{{ $randomStreetAddress() }}'
          capture:
            - json: '$.result._id'
              as: 'clientId'
      - post:
          url: '/api/invoice'
          headers:
            Authorization: 'Bearer {{ authToken }}'
          json:
            client: '{{ clientId }}'
            date: '{{ $now() }}'
            expiredDate: '{{ $futureDate() }}'
            items:
              - itemName: 'Product {{ $randomNumber(1, 1000) }}'
                description: 'Test product description'
                quantity: '{{ $randomNumber(1, 10) }}'
                price: '{{ $randomNumber(10, 500) }}'
                total: '{{ $randomNumber(10, 5000) }}'
            taxRate: 10
            discount: 0

  - name: 'Payment Processing Load Test'
    weight: 30
    flow:
      - post:
          url: '/api/login'
          json:
            email: '{{ $randomEmail() }}'
            password: 'password123'
          capture:
            - json: '$.result.token'
              as: 'authToken'
      - get:
          url: '/api/invoice?limit=1'
          headers:
            Authorization: 'Bearer {{ authToken }}'
          capture:
            - json: '$.result.items[0]._id'
              as: 'invoiceId'
            - json: '$.result.items[0].client'
              as: 'clientId'
      - post:
          url: '/api/payment'
          headers:
            Authorization: 'Bearer {{ authToken }}'
          json:
            client: '{{ clientId }}'
            invoice: '{{ invoiceId }}'
            amount: '{{ $randomNumber(100, 1000) }}'
            currency: 'USD'
            date: '{{ $now() }}'
            description: 'Load test payment'

  - name: 'Data Retrieval Load Test'
    weight: 30
    flow:
      - post:
          url: '/api/login'
          json:
            email: '{{ $randomEmail() }}'
            password: 'password123'
          capture:
            - json: '$.result.token'
              as: 'authToken'
      - get:
          url: '/api/client'
          headers:
            Authorization: 'Bearer {{ authToken }}'
      - get:
          url: '/api/invoice'
          headers:
            Authorization: 'Bearer {{ authToken }}'
      - get:
          url: '/api/payment'
          headers:
            Authorization: 'Bearer {{ authToken }}'
      - get:
          url: '/api/client/search?q={{ $randomWord() }}'
          headers:
            Authorization: 'Bearer {{ authToken }}'
