name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: SSH into VPS and deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          script: |
            cd /root/ERP.js
            git pull origin main

            # Backend
            cd backend
            npm install --omit=dev
            pm2 restart backend || pm2 start src/server.js --name backend
            cd ..

            # Frontend
            cd frontend
            npm install
            npm run build
            cd ..

            # Deploy frontend to /var/www/erp
            sudo mkdir -p /var/www/erp
            sudo rm -rf /var/www/erp/*
            sudo cp -r frontend/dist/* /var/www/erp/
            sudo chown -R www-data:www-data /var/www/erp
            sudo chmod -R 755 /var/www/erp

            # Reload Nginx
            sudo nginx -t
            sudo systemctl reload nginx
