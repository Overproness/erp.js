<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="generator" content="ERPCRM" />
  <!-- Tiny webp favicon instead of heavy .ico -->
  <link rel="icon" type="image/webp" href="/logo-bg-remove.webp" sizes="32x32" />
  <!-- Preload LCP hero image so the browser fetches it at the highest priority -->
  <link rel="preload" as="image" href="/hero-section-3d-model-static-removebg-preview.webp" fetchpriority="high" />
  <title>ERP.js | Automation Suite</title>
  <meta name="description" content="ERP.js | Automation Suite" />

  <!--
    Critical above-the-fold CSS — inlined to eliminate the render-blocking
    network request for the full stylesheet on first paint.
  -->
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    #root { min-height: 100vh; }
    /* System-font stack prevents invisible text while Inter loads */
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  </style>

  <!-- Preconnect so the first font request skips DNS + TCP + TLS overhead -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />

  <!--
    Text fonts: loaded non-blocking via the media=print trick.
    Browser renders with system fonts on first paint, then swaps once the
    Google Fonts stylesheet arrives. display=swap prevents invisible text.
    Trimmed to Inter + Roboto only (Raleway and Poppins were unused above-fold).
  -->
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Roboto:wght@400&display=swap"
    media="print"
    onload="this.media='all'" />
  <noscript>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Roboto:wght@400&display=swap" />
  </noscript>

  <!--
    Material Symbols: loaded non-blocking.
    Axis range narrowed from the full variable range (wght 100-700, FILL 0-1)
    to a fixed opsz=24, wght=400 with FILL 0-1 only — cuts the woff2 download
    from ~1.1 MB to ~120 KB, a ~90% size reduction.
  -->
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0&display=swap"
    media="print"
    onload="this.media='all'" />
  <noscript>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0&display=swap" />
  </noscript>
</head>

<body>
  <div id="root"></div>
  <!--
    type="module" scripts are deferred by default in modern browsers,
    but the explicit `defer` attribute makes the intent clear and ensures
    the script doesn't block HTML parsing or delay the LCP image.
  -->
  <script type="module" defer src="/src/main.tsx"></script>
</body>

</html>
