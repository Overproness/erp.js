  <!--
    Critical above-the-fold CSS: inlined to eliminate render-blocking network requests on first paint.
  -->
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    #root { min-height: 100vh; }
    :root {
      --font-heading: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
    }
    body {
      font-family: var(--font-sans);
      color: #191c1d;

    }
    h1, h2, h3, h4, h5, h6 {
      font-family: var(--font-heading);
    }
  </style>

  <!-- Preconnect so the first font request skips DNS + TCP + TLS overhead -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />

    Fonts: Plus Jakarta Sans for prominent geometric headings, Inter for clean UI typography.
